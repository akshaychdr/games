<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c1424">
  <title>Games</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%235c1424' width='32' height='32' rx='6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e6c36a'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Noto Serif Devanagari";
      src: url("snakes-and-ladders/assets/devanagari.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 10%, rgba(243, 212, 138, 0.18), transparent 26%),
        #5c1424;
      color: #f8ecd0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      padding: 28px 18px 48px;
    }
    h1 { font-size: clamp(36px, 6vw, 56px); margin: 0 0 6px; }
    .lead { margin: 0 0 22px; color: #f3d48a; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; max-width: 520px; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 16px 16px 14px;
      border-radius: 16px;
      border: 2px solid #e6c36a;
      background: #7a2434;
    }
    a.card strong {
      display: block;
      font-family: "Noto Serif Devanagari", Georgia, serif;
      font-size: 28px;
    }
    a.card span { display: block; margin-top: 4px; color: #f3d48a; }
  </style>
</head>
<body>
  <h1>Games</h1>
  <p class="lead">Play in the browser. Nothing to install.</p>
  <ul>
    <li>
      <a class="card" href="snakes-and-ladders/">
        <strong>साँप सीढ़ी</strong>
        <span>Saanp Seedhi · Snakes &amp; Ladders for 2 to 4 players</span>
      </a>
    </li>
  </ul>
</body>
</html>
