<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c342e">
  <title>Saanp Seedhi · Snakes &amp; Ladders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%233c342e' width='32' height='32' rx='6'/%3E%3Cpath d='M6 22c6-2 8-10 14-10 2 4-2 8-6 8 6 0 10-6 12-10' fill='none' stroke='%236e8f74' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Noto Serif Devanagari";
      src: url("assets/devanagari.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #3c342e;
      color: #f3eadc;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    #stage {
      min-height: 0;
      display: grid;
      place-items: center;
      align-items: end;
      padding: 8px 8px 4px;
    }
    #board {
      width: min(100%, calc(100dvh - 196px));
      max-height: calc(100dvh - 196px);
      height: auto;
      aspect-ratio: 1;
      touch-action: none;
      border-radius: 4px;
    }
    #dock {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      grid-template-areas:
        "bar bar"
        "title title"
        "roster die"
        "status die"
        "hint hint";
      gap: 2px 10px;
      align-items: center;
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
      background: #3c342e;
    }
    .top {
      grid-area: bar;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .home {
      color: #cbbfa8;
      text-decoration: none;
      font-size: 13px;
    }
    h1 { grid-area: title; margin: 0; font-weight: 700; line-height: 1.05; }
    h1 .hi {
      font-family: "Noto Serif Devanagari", Georgia, serif;
      font-size: 22px;
      color: #f4ecdc;
      display: block;
    }
    h1 small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #cbbfa8;
      font-weight: 400;
    }
    #mute {
      min-width: 44px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(244, 236, 220, 0.35);
      background: transparent;
      color: #f3eadc;
      font: inherit;
      font-size: 13px;
    }
    #roster {
      grid-area: roster;
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    #roster li {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      min-height: 26px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(244, 236, 220, 0.16);
      opacity: 0.62;
    }
    #roster li.on { opacity: 1; }
    #roster i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
    }
    #roster .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }
    #roster b { margin-left: auto; font-size: 14px; font-weight: 600; }
    #status {
      grid-area: status;
      margin: 0;
      font-size: 13px;
      color: #d9cbb6;
    }
    .hint {
      grid-area: hint;
      display: none;
      margin: 0;
      font-size: 12px;
      color: #cbbfa8;
    }
    #dice {
      grid-area: die;
      width: 76px;
      height: 76px;
      justify-self: center;
      padding: 14px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #4e473f 0%, #2a241f 58%, #14110e 100%);
      box-shadow: inset 0 8px 14px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.05);
      touch-action: manipulation;
    }
    #dice:active:not(:disabled) { transform: translateY(1px); }
    #dice:disabled { opacity: 0.8; }
    #dice canvas { width: 100%; height: 100%; display: block; }
    #menu, #win {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(28, 22, 18, 0.46);
    }
    #menu[hidden], #win[hidden] { display: none !important; }
    .card {
      width: min(420px, 100%);
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: 18px 16px 16px;
      border-radius: 16px;
      background: #f4ecdc;
      color: #2c2118;
      border: 1px solid #5a3e2b;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }
    .card h2 { margin: 0 0 8px; font-size: 22px; }
    .rules, .card p { margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: #3a2e24; }
    .count { display: flex; gap: 8px; margin: 10px 0; }
    .count button, .prow .cpu, .card .go {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #5a3e2b;
      background: transparent;
      color: #2c2118;
      font: inherit;
      font-size: 16px;
    }
    .count button { flex: 1; }
    .count button.on, .prow .cpu[aria-pressed="true"] {
      background: #4f6d62;
      color: #f4ecdc;
      border-color: #4f6d62;
    }
    .prow {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .prow i { width: 8px; height: 8px; border-radius: 50%; }
    .prow input {
      min-width: 0;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid #c9b79a;
      background: #fffaf2;
      color: #2c2118;
      font: inherit;
      font-size: 16px;
      padding: 0 10px;
    }
    .card .go {
      width: 100%;
      margin-top: 8px;
      background: #b84a4a;
      border-color: #8d3838;
      color: #f4ecdc;
      font-size: 18px;
    }
    #menu-back { background: transparent; color: #2c2118; }
    #win .card { text-align: center; }
    #win h2 { font-size: 32px; color: #2c2118; }
    @media (hover: hover) and (min-width: 800px) {
      .hint { display: block; }
    }
    @media (min-width: 900px) {
      body {
        grid-template-columns: minmax(0, 1fr) 280px;
        grid-template-rows: minmax(0, 1fr);
      }
      #stage { align-items: center; padding: 12px; }
      #board {
        width: min(100%, calc(100dvh - 24px));
        max-height: calc(100dvh - 24px);
      }
      #dock {
        grid-template-columns: 1fr;
        grid-template-areas:
          "bar"
          "title"
          "roster"
          "status"
          "die"
          "hint";
        align-content: start;
        gap: 8px;
        padding: 18px 16px 20px;
        border-left: 1px solid rgba(244, 236, 220, 0.08);
      }
      h1 .hi { font-size: 26px; }
      #dice { width: 92px; height: 92px; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="board" width="800" height="800"></canvas>
  </div>
  <aside id="dock">
    <div class="top">
      <a class="home" href="../">Games</a>
      <button id="mute" type="button">Sound on</button>
    </div>
    <h1><span class="hi">साँप सीढ़ी</span><small>Saanp Seedhi</small></h1>
    <ol id="roster"></ol>
    <p id="status" aria-live="polite">Choose players, then roll.</p>
    <button id="dice" type="button" aria-label="Roll the dice">
      <canvas id="die" width="160" height="160"></canvas>
    </button>
    <p class="hint">Press Space to roll.</p>
  </aside>
  <section id="menu">
    <div class="card">
      <h2>Who is playing?</h2>
      <div class="count" role="group" aria-label="Number of players">
        <button type="button" data-n="2" class="on">2</button>
        <button type="button" data-n="3">3</button>
        <button type="button" data-n="4">4</button>
      </div>
      <div id="rows"></div>
      <button id="start" class="go" type="button">Start</button>
      <p class="rules">Hop square by square to 100. Ladders lift you. Snakes swallow you. A 6 earns another roll. You need the exact roll to finish.</p>
    </div>
  </section>
  <section id="win" hidden>
    <div class="card">
      <p>First to 100</p>
      <h2 id="win-name"></h2>
      <button id="again" class="go" type="button">Play again</button>
      <button id="menu-back" class="go" type="button">Change players</button>
    </div>
  </section>
  <script src="game.js"></script>
</body>
</html>
