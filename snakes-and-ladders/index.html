<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c1424">
  <title>Saanp Seedhi · Snakes &amp; Ladders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%235c1424' width='32' height='32' rx='6'/%3E%3Cpath d='M6 22c6-2 8-10 14-10 2 4-2 8-6 8 6 0 10-6 12-10' fill='none' stroke='%23e6c36a' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Noto Serif Devanagari";
      src: url("assets/devanagari.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background:
        radial-gradient(circle at 12% 8%, rgba(243, 212, 138, 0.16), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(224, 112, 32, 0.18), transparent 32%),
        #5c1424;
      color: #f8ecd0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(8px + env(safe-area-inset-top)) 14px 6px;
    }
    header a.home {
      color: #f3d48a;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    h1 { margin: 0; font-weight: 700; line-height: 1; flex: 1; }
    h1 .hi {
      font-family: "Noto Serif Devanagari", Georgia, serif;
      font-size: clamp(26px, 5vw, 40px);
      display: block;
    }
    h1 small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f3d48a;
    }
    #mute {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #e6c36a;
      background: transparent;
      color: #f8ecd0;
      font: inherit;
      font-size: 14px;
    }
    #stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 8px;
    }
    #board {
      width: min(100%, calc(100dvh - 168px));
      height: auto;
      aspect-ratio: 1;
      touch-action: none;
      border-radius: 8px;
    }
    #dock {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    }
    #roster {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      min-width: 0;
    }
    #roster li {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.18);
      opacity: 0.7;
    }
    #roster li.on {
      opacity: 1;
      outline: 1px solid #f3d48a;
    }
    #roster i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex: none;
      border: 1px solid #f3d48a;
    }
    #roster .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }
    #roster b { margin-left: auto; font-size: 16px; }
    #status {
      margin: 0;
      font-size: 14px;
      color: #f3d48a;
      grid-column: 1 / -1;
    }
    #dice {
      width: 92px;
      height: 92px;
      flex: none;
      padding: 6px;
      border-radius: 22px;
      border: 3px solid #6a3a12;
      background: linear-gradient(#f8e7b8, #d7a04a);
      box-shadow: 0 6px 0 #6a3a12;
      touch-action: manipulation;
    }
    #dice:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 0 #6a3a12; }
    #dice:disabled { opacity: 0.72; }
    #dice canvas { width: 100%; height: 100%; display: block; }
    .hint { display: none; margin: 0; font-size: 12px; color: #f3d48a; }
    #menu, #win {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(40, 8, 14, 0.5);
    }
    #menu[hidden], #win[hidden] { display: none !important; }
    .card {
      width: min(440px, 100%);
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: 18px 16px 16px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 10% 0%, rgba(243, 212, 138, 0.25), transparent 40%),
        #7a2434;
      border: 2px solid #e6c36a;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .card h2 { margin: 0 0 8px; font-size: 22px; }
    .rules, .card p { margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: #f8ecd0; }
    .count { display: flex; gap: 8px; margin: 10px 0; }
    .count button, .prow .cpu, .card .go {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #e6c36a;
      background: transparent;
      color: #f8ecd0;
      font: inherit;
      font-size: 16px;
    }
    .count button { flex: 1; }
    .count button.on, .prow .cpu[aria-pressed="true"] {
      background: #e6c36a;
      color: #4a1420;
    }
    .prow {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .prow i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #f3d48a; }
    .prow input {
      min-width: 0;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(243, 212, 138, 0.6);
      background: rgba(0, 0, 0, 0.15);
      color: #fff8e8;
      font: inherit;
      font-size: 16px;
      padding: 0 10px;
    }
    .card .go {
      width: 100%;
      margin-top: 8px;
      background: #e07020;
      border-color: #a84e10;
      color: #fff8e8;
      font-size: 18px;
    }
    #win .card { text-align: center; }
    #menu-back { background: transparent; color: #f8ecd0; }
    #win h2 { font-size: 32px; color: #f8e7b8; }
    @media (hover: hover) and (min-width: 800px) {
      .hint { display: block; }
    }
    @media (min-width: 900px) {
      body {
        grid-template-columns: minmax(0, 1fr) 300px;
        grid-template-rows: auto minmax(0, 1fr);
      }
      header { grid-column: 1 / -1; }
      #dock {
        grid-column: 2;
        grid-row: 2;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
      }
      #roster { grid-template-columns: 1fr; }
      #dice { width: 120px; height: 120px; align-self: center; }
      #board { width: min(100%, calc(100dvh - 88px)); }
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="../">Games</a>
    <h1><span class="hi">साँप सीढ़ी</span><small>Saanp Seedhi</small></h1>
    <button id="mute" type="button">Sound on</button>
  </header>
  <div id="stage">
    <canvas id="board" width="800" height="800"></canvas>
  </div>
  <div id="dock">
    <div>
      <ol id="roster"></ol>
      <p id="status" aria-live="polite">Choose players, then roll.</p>
      <p class="hint">Press Space to roll.</p>
    </div>
    <button id="dice" type="button" aria-label="Roll the dice">
      <canvas id="die" width="160" height="160"></canvas>
    </button>
  </div>
  <section id="menu">
    <div class="card">
      <h2>Who is playing?</h2>
      <div class="count" role="group" aria-label="Number of players">
        <button type="button" data-n="2" class="on">2</button>
        <button type="button" data-n="3">3</button>
        <button type="button" data-n="4">4</button>
      </div>
      <div id="rows"></div>
      <button id="start" class="go" type="button">Start</button>
      <p class="rules">Hop square by square to 100. Ladders lift you. Snakes swallow you. A 6 earns another roll. You need the exact roll to finish.</p>
    </div>
  </section>
  <section id="win" hidden>
    <div class="card">
      <p>First to 100</p>
      <h2 id="win-name"></h2>
      <button id="again" class="go" type="button">Play again</button>
      <button id="menu-back" class="go" type="button">Change players</button>
    </div>
  </section>
  <script src="game.js"></script>
</body>
</html>
